
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Adventure - Adventures</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="filters.css">
</head>
<body>
<header>
    <nav>
        <h2 class="logo">Random Adventure</h2>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="adventures.html">Adventures</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="suggest-adventure.html">Suggest an Adventure</a>
        </div>
    </nav>
</header>

<div class="page-heading">
    <h1>Explore Adventures</h1>
    <p>Choose something that matches your mood and free time.</p>
</div>

<div class="container">

    <!-- Adventure Filters -->
    <div class="filters">
        <label for="location">Location:</label>
        <select id="location">
            <option value="all">All Locations</option>
            <option value="indoor">Indoor</option>
            <option value="outdoor">Outdoor</option>
        </select>

        <label for="budget">Budget:</label>
        <select id="budget">
            <option value="all">All Budgets</option>
            <option value="free">Free</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
        </select>

        <button id="apply-filters" type="button">
            Apply Filters
        </button>

        <button id="reset-filters" type="button">
            Reset
        </button>

        <p id="filter-result">Loading adventures...</p>
    </div>

    <!-- Adventure Cards -->
    <div class="cards" id="adventure-cards"></div>
</div>

<footer>
    <p>© 2026 Random Adventure | Web Programming Project</p>
</footer>

<script src="script.js"></script>

</body>
</html>
