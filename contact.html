<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Adventure - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <nav>
        <a href="index.html"><h2 class="logo">Random Adventure</h2></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="adventures.html">Adventures</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="suggest-adventure.html">Suggest an Adventure</a>
        </div>
    </nav>
</header>

<div class="container contact">
    <h1>Contact Us</h1>
    <p>Have an idea for a new adventure? Send us a message!</p>

    <form id="contact-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" minlength="2" maxlength="50" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="subject">Subject</label>
        <select id="subject" name="subject" required>
            <option>General Inquiry</option>
            <option>Support</option>
            <option>Feedback</option>
            <option>Adventure Suggestion</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" placeholder="Write your message..." minlength="10" maxlength="500" required></textarea>
        <p id="message-count" aria-live="polite">0/500 characters</p>

        <button type="submit" class="submit-btn">Send Message</button>
        <p id="form-status" role="status" aria-live="polite"></p>
    </form>
</div>

<footer>
    <p>© 2026 Random Adventure | Web Programming Project</p>
</footer>
<script src="contact.js"></script>
</body>
</html>
