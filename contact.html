<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Adventure - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <nav>
        <a href="index.html"><h2 class="logo">Random Adventure</h2></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="adventures.html">Adventures</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
</header>

<div class="container contact">
    <h1>Contact Us</h1>
    <p>Have an idea for a new adventure? Send us a message!</p>

    <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="subject">Subject</label>
        <select id="subject" name="subject">
            <option value="suggestion">Adventure Suggestion</option>
            <option value="feedback">Feedback</option>
            <option value="other">Other</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write your message here" rows="6" required></textarea>

        <button type="submit">Send Message</button>
    </form>
</div>

<footer>
    <p>© 2026 Random Adventure | Web Programming Project</p>
</footer>
</body>
</html>
